[project]
name = "meeting-copilot-api"
version = "0.6.1"
description = "Meeting Intelligence Copilot — API (local-first question copilot)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",
    "pypdf>=6.0,<7",
    "cryptography>=50,<51",
]

[project.optional-dependencies]
rag-local = [
    "onnxruntime>=1.19,<2",
    "tokenizers>=0.20,<1",
]
code-index = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=0.9,<1",
]
dev = [
    "pytest>=8",
    "httpx2>=2.12,<3",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
