name: windows-ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/frontend/pnpm-lock.yaml

      - name: Install hash-locked API dependencies
        shell: pwsh
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/Scripts/python.exe -m pip install --require-hashes -r apps/api/requirements-dev.lock

      - name: Install frozen web dependencies
        shell: pwsh
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install frozen desktop dependencies
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Run the network-disabled product gate
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/check.ps1

      - name: Run desktop behavioral tests
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm test

      - name: Type-check desktop
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm exec tsc --noEmit

      - name: Lint changed desktop integration surfaces
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: >-
          pnpm exec eslint
          src/components/ContextConnectorSettings.tsx
          src/components/IntelligencePanel/IntelligencePanel.tsx
          src/components/About.tsx
          src/app/layout.tsx
          src/services/contextConnectorService.ts
          src/services/intelligenceContracts.ts
          tests/lib/intelligence-context-connectors.test.mjs
          tests/lib/intelligence-integrations-v9.test.mjs
          tests/lib/intelligence-transport.test.ts
          --max-warnings 0

      - name: Build desktop frontend
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm build
