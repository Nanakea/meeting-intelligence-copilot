name: windows-ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/frontend/pnpm-lock.yaml

      - name: Install hash-locked API dependencies
        shell: pwsh
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/Scripts/python.exe -m pip install --require-hashes -r apps/api/requirements-dev.lock

      - name: Install frozen web dependencies
        shell: pwsh
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install frozen desktop dependencies
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Run the network-disabled product gate
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/check.ps1

      - name: Run desktop behavioral tests
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm test

      - name: Type-check desktop
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm exec tsc --noEmit

      - name: Verify editor peer compatibility
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm peers check

      - name: Lint product surfaces and ratchet inherited warnings
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm lint:release

      - name: Build desktop frontend
        shell: pwsh
        working-directory: apps/desktop/frontend
        run: pnpm build

      - name: Audit frontend dependencies
        shell: pwsh
        run: |
          pnpm --dir apps/web audit --audit-level moderate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir apps/desktop/frontend audit --audit-level moderate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scan tracked source for credential patterns
        shell: pwsh
        run: apps/api/.venv/Scripts/python.exe scripts/check-tracked-secrets.py

      - name: Audit locked Python dependencies in an isolated tool environment
        shell: pwsh
        run: |
          python -m venv tmp/audit-tool
          tmp/audit-tool/Scripts/python.exe -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tmp/audit-tool/Scripts/python.exe -m pip_audit --disable-pip --no-deps -r apps/api/requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  packaged-backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install reviewed packaging toolchain
        shell: pwsh
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/Scripts/python.exe -m pip install --require-hashes -r apps/api/requirements-dev.lock -r apps/api/requirements-packaging.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and exercise the real executable
        shell: pwsh
        run: |
          ./scripts/build-backend-sidecar.ps1
          ./scripts/test-backend-sidecar.ps1
          ./scripts/run-packaged-acceptance.ps1
